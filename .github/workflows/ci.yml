name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 8 * * 1'

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Check Python syntax
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check code formatting
        run: isort --check-only --diff src/ tests/ || true

      - name: Check black formatting
        run: black --check src/ tests/ || true

  security-scan:
    name: Security and Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install locked application dependencies
        id: install-locked-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Install pinned security tools
        id: install-security-tools
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Run Bandit (fail on medium/high-confidence findings)
        run: bandit -r src/ --severity-level medium --confidence-level medium -f json -o security-report.json

      - name: Audit locked dependencies
        if: always() && steps.install-locked-dependencies.outcome == 'success' && steps.install-security-tools.outcome == 'success'
        run: pip-audit -r requirements.lock

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
          retention-days: 7
          if-no-files-found: ignore

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Test CLI help
        run: python main.py --help

      - name: List headers
        run: python main.py headers

      - name: Test scan functionality
        run: python main.py scan https://example.com --format json
